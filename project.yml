# Prohisob iOS ilovasi — XcodeGen loyihasi (Mac'da: brew install xcodegen && xcodegen generate). CI: .github/workflows/ios.yml
# Ma'lumot https://cabinet.prohisob.com API'sidan (sayt bilan bir xil). Batafsil: README.md, docs/API.md
name: Prohisob
options:
  bundleIdPrefix: com.prohisob
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: uz
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Prohisob:
    type: application
    platform: iOS
    sources:
      - path: Prohisob
    info:
      path: Prohisob/Info.plist
      properties:
        CFBundleDisplayName: Prohisob
        CFBundleName: Prohisob
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: uz
        CFBundleLocalizations: [uz]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSCameraUsageDescription: Chek va kvitansiyani suratga olib, yozuvga biriktirish uchun kamera kerak.
        NSPhotoLibraryUsageDescription: Galereyadagi chek rasmlarini yozuvga biriktirish uchun.
        NSFaceIDUsageDescription: Ilovani Face ID bilan qulflash va tez ochish uchun.
        LSApplicationQueriesSchemes: [tg]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prohisob.app
        PRODUCT_NAME: Prohisob
        TARGETED_DEVICE_FAMILY: "1"   # faqat iPhone (XcodeGen target darajasida "1,2" qo'yadi — loyiha darajasidagisi yetmaydi)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  Prohisob:
    build:
      targets:
        Prohisob: all
    run:
      config: Debug
    archive:
      config: Release
